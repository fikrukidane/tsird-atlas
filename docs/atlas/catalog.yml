search:
  version: "1.0"
  dataroot: "$"
  items:
    - name: TigrayWoredaNew
      description: "Search by WEREDA"
      layer_name: TigrayWoredaNew
      fields:
        - name: WEREDA
          type: string
          description: "Woreda name"
          wildcard: true
    - name: TigrayZones
      description: "Search by ZONE_NAME"
      layer_name: TigrayWoredaNew
      fields:
        - name: ZONE_NAME
          type: string
          description: "Zone name"
          wildcard: true
    - name: TigraiTabiasNew
      description: "Search by TABIA"
      layer_name: TigraiTabiasNew
      fields:
        - name: TABIA
          type: string
          description: "Tabia name"
          wildcard: true
    - name: RoadName
      description: "Search by Road Name"
      layer_name: TigrayRoadsIn2006
      fields:
        - name: NAME
          type: string
          description: "Road name"
          wildcard: true
          definition:
            keyfield: NAME
            showfield: NAME
    - name: TabiaPopulation
      description: "Tabia population search"
      layer_name: PopulationDensity2006
      fields:
        - name: ZONES
          type: string
          description: "Zone name"
          definition:
            options: []
        - name: DENSITY
          type: number
          description: "Population density"
          definition:
            operator: [">", "=", "<"]
    - name: BASIN_NAME
      description: "Search by BASIN_NAME"
      layer_name: Basins
      fields:
        - name: BASIN_NAME
          type: string
          description: "Basin name"
          wildcard: true
    - name: SoilType
      description: "Search by Soil Name"
      layer_name: Soils
      fields:
        - name: NAME
          type: string
          description: "Soil name"
          wildcard: true
          definition:
            keyfield: NAME
            showfield: NAME

# --- YAML Validation Checklist ---
# - Ensure every group in all_groups is present in groups mapping
# - Ensure every group in default_groups is present in all_groups
# - Ensure all toc categories reference only groups in all_groups
# - Ensure all YAML keys are consistently indented (2 spaces)
# - Ensure all placeholder fields are present for future mapping
# - Ensure endpoints, map, ui, query, print, download, locale, plugins, toc, groups, search sections exist
# - Ensure no invented datasets or groups
# - Ensure valid YAML syntax (use yamllint or similar)
