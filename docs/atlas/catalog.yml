schema_version: 1

atlas:
  title: "Tigray Digital Web Atlas"
  debug_level: 3

endpoints:
  wms_external: "https://lab.tigrayinsights.net/map/ogc"
  wms_local: "http://127.0.0.1:18080/map/ogc"

map:
  mapfile: "Tigrai.map"
  template_mapfile: "common/template.map"
  layer_auto_refresh: 1
  img_format: "png8"
  alt_img_format: "jpeg"
  slider_max: "max"
  slider_min: 10000

  view:
    crs: "EPSG:4326"
    extent: [33.0, 3.0, 48.0, 15.5]
    center: [40.0, 9.0]
    zoom_hint: 6
  
ui:
  toc_style: "tree"
  legend_style: "attached"
  use_categories: 1
  cat_with_checkbox: 1
  scale_layers: 1
  ico_w: 18
  ico_h: 14
  legend_keyimage_rewrite: 0

query:
  limit_result: 300
  highlight_color: "255 255 0"
  highlight_selected: 1
  auto_zoom: ["nquery", "search"]
  zoom_all: ["search", "nquery"]
  info_win: "dynwin"
  align_query_results: 1
  point_buffer: 10000
  shape_query_buffer: 0.02

print:
  print_img_format: "png"
  print_alt_img_format: "jpeg"
  pdfres: 2

download:
  dpi_levels: [150, 200, 300]

locale:
  default_language: "en"
  default_charset: "UTF-8"
  map2unicode: 0

plugins:
  enabled:
    - export
    - scalebar
    - transparency2
  config:
    transparency2:
      use_opacity: "off"
    export:
      formats: ["XLS", "CSV", "PDF"]
  disabled_available:
    - coordinates
    - locateXY
    - unitAndProj
    - displaymarker
    - proj4js
    - layerselect
    - transparency
    - queryeditor
    - graphicalqueries
    - searchtool
    - selectionManagement

toc:
  categories:
    - name: cat_mapelements
      groups: [SAMPLE_GRID, Credits]
    - name: cat_adminRegional
      groups: [Regions, TigrayWoredaNew, TigraiTabiasNew, Towns, PopulationDensity2006]
    - name: cat_infrastructure
      closed: true
      groups: [TigraySchools2006, Health_Institutions, TigrayRoadsIn2006, EthiopiaRoadsOld, MetStations]
    - name: cat_health
      closed: true
      groups: [Full_immunization, PNC, Skilled_delivery, CAR, P-LBW, TB_Success_rate, PIHCT_testing_rate, ANC_Tested_PMTCT, Abortion_Ratio]
    - name: cat_nature
      closed: true
      groups: [Streams, Wetlands, Lakes, Basins, Soils, EcoZones, NationalForests, NationalParks, Contour, Isoheight]
    - name: cat_raster
      closed: true
      groups: [DTM, Slope, Hillshade]
    - name: cat_satimages
      closed: true
      groups: [BaseMap, Ethnomap]
  all_groups:
    - BaseMap
    - Ethnomap
    - NationalBoundary
    - Regions
    - Zones
    - Eth_Zones_New
    - Administration
    - Towns
    - Tigray_Towns
    - PopulationDensity2006
    - TigrayWoredaNew
    - TigrayNewWoredas
    - TigraiTabiasNew
    - TigraySchools2006
    - Health_Institutions
    - TigrayHealth2006
    - TigrayRoadsIn2006
    - TigrayRoads2006t
    - EthiopiaRoadsOld
    - EthioWoredasNew
    - Full_immunization
    - PNC
    - Skilled_delivery
    - CAR
    - P-LBW
    - TB_Success_rate
    - PIHCT_testing_rate
    - ANC_Tested_PMTCT
    - Abortion_Ratio
    - Lakes
    - Basins
    - Soils
    - EcoZones
    - NationalForests
    - NationalParks
    - MetStations
    - Isoheight
    - Streams
    - Wetlands
    - Contour
    - DTM
    - Slope
    - Hillshade
    - SAMPLE_GRID
    - Credits
  default_groups:
    - TigraiTabiasNew
    - Towns
    - TigrayRoadsIn2006
    - SAMPLE_GRID
    - Credits
    - BaseMap
    - Hillshade

