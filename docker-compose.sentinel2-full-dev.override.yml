# Isolated local DEV overlay for the all-Tabia HLS monthly NDMI map. It is
# intentionally not referenced by any production compose configuration.
services:
  tsird-web:
    build:
      context: C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/ui/web
      dockerfile: Dockerfile
    image: tsird-atlas-tsird-web:dev-hls-ndmi-full-20261025-5
  tsird-api:
    build:
      context: C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/api
      dockerfile: Dockerfile
    image: tsird-atlas-tsird-api:dev-hls-ndmi-full-20261025-5
  tsird-drought-runner:
    build:
      context: C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/etl
      dockerfile: Dockerfile
    image: tsird-atlas-tsird-drought-runner:dev-hls-ndmi-full-20261025-5
    env_file: !override
      - C:/docker/projects/tsird-atlas/.env.tsird
      - C:/docker/projects/tsird-atlas/.env.tsird.cdse
      - C:/docker/projects/tsird-atlas/.env.tsird.cds
      - path: C:/docker/projects/tsird-atlas/.env.tsird.earthdata
        required: false
  tsird-mapserver:
    volumes:
      - C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/infra/mapserver/mapfiles:/etc/mapserver
      - C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/infra/mapserver/mapfiles/ms.config:/etc/mapserver.conf:ro
      - C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/infra/mapserver/fonts:/fonts:ro
      - C:/docker/projects/tsird-atlas/.worktrees/vegetation-moisture-pilot/infra/mapserver/symbols:/symbols:ro
      - C:/docker/projects/tsird-atlas/data:/data:ro
      - tsird-mapserver-tmp:/tmp
