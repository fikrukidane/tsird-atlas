# Local, isolated Stage 2 performance stage. It never replaces the running DEV
# or the earlier Stage 1 performance stack: it has unique container names and
# exposes only loopback port 18083. The stage
# joins the existing TSIRD network to read from its healthy PostGIS/MapServer
# services, while its own API has a read-only evidence-data mount.
services:
  tsird-api-stage2:
    build: ./api
    container_name: tsird-api-stage2
    env_file:
      - ../../.env.tsird
    volumes:
      # A local, ignored mirror of only the already-public first-load assets.
      # It is deliberately distinct from the live DEV data directory.
      # Preserve the Stage 1 review fixture for the review and priority pages.
      - ../performance-stage1/data.local/performance-stage-release:/data/drought/production-releases:ro
      # The automatic indicator channel lives below `indicators/`. This Stage
      # 2 fixture overlays only that channel with two retained snapshots for
      # deep-link certification. Both mounts are ignored, local and read-only.
      - ./data.local/performance-stage-release:/data/drought/production-releases/indicators:ro
    networks:
      - tsird-stage-network

  tsird-web-stage2:
    build: ./ui/web
    container_name: tsird-web-stage2
    networks:
      - tsird-stage-network
    volumes:
      - ./infra/production-public-web/data/atlas-registry.json:/usr/share/nginx/html/data/atlas-registry.json:ro
      - ./infra/production-public-web/drought/index.html:/usr/share/nginx/html/drought/index.html:ro

  tsird-edge-stage2:
    build: ./infra/edge
    container_name: tsird-edge-stage2
    volumes:
      - ./infra/edge/nginx.performance-stage.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tsird-stage-network
    ports:
      - "127.0.0.1:18083:8080"

networks:
  tsird-stage-network:
    name: tsird-network
    external: true
