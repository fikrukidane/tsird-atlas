# Production-only TSIRD overlay.
#
# Use on the existing Ubuntu VPS at /opt/tigrayinsights/apps/tsird together
# with docker-compose.yml. It mounts only compact, publisher-approved drought
# releases into the API; it does not mount n8n state, raw source artifacts or
# the development drought runner.
services:
  # The constrained VPS must pull immutable prebuilt application images. The
  # placeholder tag is intentionally rejected by the release preflight; do not
  # replace it with a local `build` fallback.
  tsird-web:
    image: ${TSIRD_WEB_IMAGE:-ghcr.io/fikrukidane/tsird-atlas-web:REPLACE_ME}
    build: !reset null
    # Development and production share immutable web images.  These small
    # production-only HTML overlays keep the familiar route names while
    # preventing public pages from calling development APIs or controls.
    volumes:
      - type: bind
        source: ./infra/production-public-web/drought/index.html
        target: /usr/share/nginx/html/drought/index.html
        read_only: true
      - type: bind
        source: ./infra/production-public-web/drought/priority/index.html
        target: /usr/share/nginx/html/drought/priority/index.html
        read_only: true
      - type: bind
        source: ./infra/production-public-web/drought/release/index.html
        target: /usr/share/nginx/html/drought/release/index.html
        read_only: true
      - type: bind
        source: ./infra/production-public-web/drought/priority/model/index.html
        target: /usr/share/nginx/html/drought/priority/model/index.html
        read_only: true
      - type: bind
        source: ./infra/production-public-web/drought/priority/scenario/index.html
        target: /usr/share/nginx/html/drought/priority/scenario/index.html
        read_only: true
      - type: bind
        source: ./infra/production-public-web/drought/control/index.html
        target: /usr/share/nginx/html/drought/control/index.html
        read_only: true

  tsird-api:
    image: ${TSIRD_API_IMAGE:-ghcr.io/fikrukidane/tsird-atlas-api:REPLACE_ME}
    build: !reset null
    environment:
      DROUGHT_PUBLIC_RELEASE_ROOT: /data/drought/production-releases
    volumes:
      - type: bind
        source: /opt/tigrayinsights/apps/tsird/releases/drought
        target: /data/drought/production-releases
        read_only: true

  # Only immutable, display-ready indicator packages are visible to MapServer.
  # The parent mount lets the activation utility atomically replace `current`
  # without a container restart and never exposes development source archives.
  tsird-mapserver:
    volumes:
      - type: bind
        source: /opt/tigrayinsights/apps/tsird/releases/drought/indicators
        target: /data/drought/production-indicators
        read_only: true

  tsird-edge:
    image: ${TSIRD_EDGE_IMAGE:-ghcr.io/fikrukidane/tsird-atlas-edge:REPLACE_ME}
    build: !reset null

  # Retrieval and processing remain on development infrastructure. Retaining
  # this service behind a non-default profile prevents `compose up` on the VPS
  # from starting or building it.
  tsird-etl:
    profiles: [development-only]
