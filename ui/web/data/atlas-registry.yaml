version: '1.0'
atlas:
  title: TSIRD Atlas v2.0
  canonical_crs: EPSG:4326
  view_crs: EPSG:3857
  center:
  - 38.0
  - 13.6
  zoom: 10
  extent:
  - 36.3
  - 12.2
  - 40.3
  - 14.9
services:
  wms:
    base_url: http://localhost:18080/map/ogc
    allowed_requests:
    - GetCapabilities
    - GetMap
    - GetFeatureInfo
ui:
  layer_order_policy: registry_order
  legend:
    enabled: true
  identify:
    enabled: true
categories:
- id: cat_mapelements
  label: Map Elements
  closed: false
  groups:
