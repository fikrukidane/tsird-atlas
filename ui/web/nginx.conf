server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # OGC endpoint (MapServer) under /map/ogc
    location ^~ /map/ogc {
        proxy_pass http://tsird-mapserver:80/ogc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve application under /map/
    location /map/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        # Development reviews must not retain an obsolete shell, script, or style.
        # Versioned URLs remain useful, but every map asset is revalidated on load.
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Health endpoint
    location = /health {
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Fallback for root
    location / {
        return 301 /map/;
    }
}
