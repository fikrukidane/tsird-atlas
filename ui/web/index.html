<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSIRD Phase 2 — Tigray Insights Web Atlas</title>

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.1.0/ol.css" />

  <!-- Application CSS -->
  <link rel="stylesheet" href="css/style.css?v=20260226" />
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header>
      <h1>🗺️ TSIRD Phase 2 — Tigray Insights Digital Atlas</h1>
    </header>

    <!-- Main Content: Map + TOC -->
    <div id="main-container">
      <!-- Map Container (70%) -->
      <div id="map-container">
        <div id="map-loading" class="loading">Loading map...</div>
        <!-- OpenLayers target element -->
        <div id="map" class="map"></div>
      </div>

      <!-- TOC Sidebar (30%) -->
      <div id="toc-container">
        <div class="loading">Loading layers...</div>
      </div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- External Libraries -->
  <!-- ═════════════════════════════════════════════════════════════ -->

  <!-- OpenLayers (WMS & map rendering) -->
  <script src="https://cdn.jsdelivr.net/npm/ol@8.1.0/dist/ol.js"></script>

  <!-- js-yaml (YAML registry parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- Application Modules -->
  <!-- ═════════════════════════════════════════════════════════════ -->

  <!-- Registry Loading -->
  <script src="src/registry/RegistryLoader.js?v=20260226"></script>

  <!-- Map Management -->
  <script src="src/map/MapController.js?v=20260226b"></script>
  <script src="src/map/LayerFactory.js?v=20260226"></script>
  <script src="src/map/ScaleEngine.js?v=20260226"></script>  <!-- Milestone 2: Scale calculations -->

  <!-- Interactions -->
  <script src="src/interactions/InteractionController.js?v=20260226"></script>

  <!-- Application Orchestration -->
  <script src="src/main.js?v=20260226d"></script>

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- Development Console Log -->
  <!-- ═════════════════════════════════════════════════════════════ -->
  <script>
    console.log('TSIRD Phase 2 Milestone 2 — Frontend Loaded');
    console.log('Registry path: data/atlas-registry.json');
    console.log('Open DevTools (F12) to view initialization logs.');
    console.log('Network tab: watch for WMS GetMap + GetFeatureInfo requests (no WFS GetFeature)');
    console.log('Milestone 2: Scale enforcement, mutex pairs, identify (GetFeatureInfo)');
  </script>
</body>
</html>
