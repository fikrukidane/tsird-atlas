<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSIRD Atlas — Tigray Insights Digital Atlas</title>

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.1.0/ol.css" />

  <!-- Application CSS -->
  <link rel="stylesheet" href="css/style.css?v=20260308" />
  <link rel="stylesheet" href="css/phase3-controls.css?v=20260308" />
</head>
<body>
  <div id="app-container">
    <header>
      <div class="site-header-row"><h1>🗺️ TSIRD Atlas — Tigray Insights Digital Atlas</h1><nav class="site-nav" aria-label="Primary navigation"><a href="drought/">Drought Intelligence</a></nav></div>
    </header>
    <div id="main-container">
      <div id="map-container">
        <div id="map-loading" class="loading">Loading map...</div>
        <div id="map" class="map"></div>
      </div>
      <div id="toc-resizer" title="Drag to resize"></div>
      <div id="toc-container">
        <div class="loading">Loading layers...</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- External Libraries                                     -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- OpenLayers (global `ol`) -->
  <script src="https://cdn.jsdelivr.net/npm/ol@8.1.0/dist/ol.js"></script>

  <!-- js-yaml (YAML registry parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Application Modules (plain classic scripts)           -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Registry -->
  <script src="src/registry/RegistryLoader.js?v=20260308"></script>

  <!-- Map -->
  <script src="src/map/MapController.js?v=20260308"></script>
  <script src="src/map/LayerFactory.js?v=20260308"></script>
  <script src="src/map/ScaleEngine.js?v=20260308"></script>

  <!-- Interactions -->
  <script src="src/interactions/InteractionController.js?v=20260908"></script>

  <!-- UI -->
  <script src="src/ui/TocResizer.js?v=20260308"></script>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Phase 3: Search, Navigator, Measure                    -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Config constant (TSIRD_FULL_EXTENT_4326) -->
  <script src="src/config/extents.js?v=20260308"></script>

  <!-- Tools (HighlightOverlay, MeasureTool — must load before controls) -->
  <script src="src/tools/HighlightOverlay.js?v=20260308"></script>
  <script src="src/tools/MeasureTool.js?v=20260308"></script>

  <!-- OL Controls (extend ol.control.Control) -->
  <script src="src/controls/SearchControl.js?v=20260308"></script>
  <script src="src/controls/FullZoomControl.js?v=20260308"></script>
  <script src="src/controls/MeasureControl.js?v=20260308"></script>
  <!-- Application Orchestration -->
  <script src="src/main.js?v=20260908d"></script>

  <!-- Dev log -->
  <script>
    console.log('TSIRD Phase 3 — Search, Navigator, Measure Tools');
    console.log('Registry: data/atlas-registry.json');
    console.log('Gazetteer API: /map/api/gazetteer?q=...');
    console.log('Open DevTools (F12) to view initialization logs.');
  </script>
</body>
</html>
