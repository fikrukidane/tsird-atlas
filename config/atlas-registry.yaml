    label: Alternate Datasets
    layers:
    - ethiopia_boundary_level1
    - ethiopia_boundary_level2
    - ethiopia_boundary_level3
- id: cat_transport
  label: Transportation
  groups:
  - id: grp_roads_gold
    label: Roads - Gold
    layers:
    - ethiopia_roads
    - tigray_roads_2006
  - id: grp_roads_raw
    label: Roads - Raw Sources
    layers:
    - ethiopia_roads_raw
    - ethiopia_roads_baseline
    - tigray_roads_2006t
- id: cat_settlements
