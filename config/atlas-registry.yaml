    - ethiopia_hillshade
  - id: grp_slope
    label: Slope
    layers:
    - ethiopia_slope
    - ethiopia_slope_rgb
  - id: grp_contours
    label: Contours
    layers:
    - ethiopia_contour
    - ethiopia_isoheight
    - tigray_contour
- id: cat_hydrology
