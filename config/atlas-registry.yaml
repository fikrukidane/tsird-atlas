version: '1.0'
atlas:
  title: TSIRD Atlas v2.0
  canonical_crs: EPSG:4326
  view_crs: EPSG:3857
  center:
  - 39.5
  - 13.5
  zoom: 7
  extent:
  - 33.0
  - 3.0
  - 48.0
  - 15.5
services:
  wms:
    base_url: http://localhost:18080/map/ogc
    allowed_requests:
    - GetCapabilities
    - GetMap
    - GetFeatureInfo
ui:
  layer_order_policy: registry_order
  legend:
    enabled: true
  identify:
    enabled: true
categories:
- id: cat_admin
  label: Administrative Boundaries
  groups:
  - id: grp_admin_national
    label: National Level
    layers:
    - ethiopia_aoi
    - ethiopia_zones
    - ethiopia_admin
  - id: grp_admin_subnational
    label: Subnational Units
    layers:
    - ethiopia_woredas
    - tigray_woreda
    - tigray_tabias
