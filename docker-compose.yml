services:
  tsird-postgis:
    image: postgis/postgis:16-3.4
    container_name: tsird-postgis
    env_file: .env.tsird
    volumes:
      - tsird-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tsird-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  tsird-mapserver:
    image: camptocamp/mapserver:8.6.0
    container_name: tsird-mapserver
    env_file: .env.tsird
    environment:
      MS_DEBUGLEVEL: "5"
      MS_ERRORFILE: "stderr"
      CPL_DEBUG: "ON"
      MS_MAPFILE: "/etc/mapserver/tsird.map"
      MAPSERVER_CONFIG_FILE: "/etc/mapserver.conf"  # Required for Apache/fcgid to pass to mapserv CGI
    volumes:
      - ./infra/mapserver/mapfiles:/etc/mapserver
      - ./infra/mapserver/mapfiles/ms.config:/etc/mapserver.conf:ro
      - ./infra/mapserver/fonts:/fonts:ro
      - ./infra/mapserver/symbols:/symbols:ro
      - ./data:/data:ro
    networks:
      - tsird-network
    depends_on:
      tsird-postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost/?map=/etc/mapserver/tsird.map&SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&FORMAT=image/png&LAYERS=tigray_towns&WIDTH=256&HEIGHT=128&CRS=EPSG:4326&BBOX=36,12,40,15\" | grep -aq 'PNG' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  tsird-web:
    build: ./ui/web
    container_name: tsird-web
    networks:
      - tsird-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  tsird-etl:
    build: ./etl
    container_name: tsird-etl
    env_file: .env.tsird
    volumes:
      - ./data:/data
    networks:
      - tsird-network
    depends_on:
      tsird-postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/etl_healthcheck.sh || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  tsird-api:
    build: ./api
    container_name: tsird-api
    env_file: .env.tsird
    networks:
      - tsird-network
    depends_on:
      tsird-postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  tsird-edge:
    build: ./infra/edge
    container_name: tsird-edge
    env_file: .env.tsird
    networks:
      - tsird-network
    depends_on:
      tsird-web:
        condition: service_healthy
      tsird-mapserver:
        condition: service_healthy
      tsird-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TSIRD_EDGE_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/map/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  tsird-network:
    name: tsird-network
    driver: bridge

volumes:
  tsird-pgdata:
    name: tsird-pgdata
