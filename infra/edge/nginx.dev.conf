# Local DEV edge only. Production uses nginx.conf, which denies mutable
# development endpoints. This file deliberately keeps the same-origin routes,
# loopback host binding, fixed MapServer mapfile, and compression policy while
# allowing the local development dashboard to read its internal evidence API.
user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=30s;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    map $args $args_nomap {
        default $args;
        ~*^map=[^&]*$ "";
        ~*^map=[^&]*&(.*)$ $1;
        ~*(.*)&map=[^&]*$ $1;
        ~*(.*)&map=[^&]*&(.*)$ $1&$2;
    }

    server {
        listen 8080;
        location /map/api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tsird-api:8000/;
            proxy_redirect off;
        }
        location /map/ogc {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tsird-mapserver:80/?map=/etc/mapserver/tsird.map&$args_nomap;
            proxy_redirect off;
        }
        location /map/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tsird-web:8080$request_uri;
            proxy_redirect off;
        }
        location = /map/health { add_header Content-Type text/plain; return 200 'OK'; }
        location = /map/version { add_header Content-Type application/json; return 200 '{"service":"tsird-edge","version":"dev-source-refresh"}'; }
    }
}
