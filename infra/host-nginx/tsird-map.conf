# Host Nginx — TSIRD Atlas app configuration
# Deploy at: /etc/nginx/lab/apps/tsird-map.conf
# Apply with: sudo nginx -t && sudo systemctl reload nginx

# Redirect bare /map to /map/ (trailing slash canonical)
location = /map {
    return 301 /map/;
}

# Proxy all /map/ traffic to the Docker edge container
location /map/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://127.0.0.1:18080;
    proxy_redirect off;
}
